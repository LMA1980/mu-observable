[advisories]
# mu-auth (github-oauth) -> webauthn-rs-core 0.6.2 -> crypto-glue 0.2.2 locks rsa 0.10.0-rc.19
# (with crypto-bigint constant-time mitigations); rsa 0.10.0 removed the `sha2` feature
# required by crypto-glue, and neither mu-auth nor mu-observable performs RSA private-key operations.
ignore = ["RUSTSEC-2023-0071"]
